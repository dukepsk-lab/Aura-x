# Top-level Aura-X config. Sub-configs are split for clarity and merged at load.
# Secrets/connection details come from the environment (.env), NOT from here.
project: aura-x
version: 0.1.0

includes:
  - instruments.yaml
  - features.yaml
  - labeling.yaml

# Layer 2 regime detection (HMM + Hurst/KER gating; referenced in §6 formulas).
regime:
  hurst_trend_threshold: 0.55
  ker_trend_threshold: 0.30
  shock_atr_percentile: 0.90        # ATR-pct above this => shock => stand down
  hmm_states: 3                     # trending / ranging / high-vol-shock
  features:                         # L1 columns fed to the regime HMM
    - vol_realized_vol
    - tm_hurst
    - tm_ker
    - vol_atr_pct

# Layer 3 primary SIDE ensemble. Members blended by weight; Layer 2 regime can
# override the weights (momentum-leaning in trend, mean-reversion-leaning in range).
# flat_threshold is the up-down margin below which the model abstains — keep it
# low for high recall (precision is delegated to the L5 meta-model).
primary:
  members:
    lightgbm: 0.6
    catboost: 0.4
  flat_threshold: 0.15
  regime_overrides:
    trend: { lightgbm: 0.7, catboost: 0.3 }
    range: { lightgbm: 0.4, catboost: 0.6 }
    shock: { lightgbm: 0.5, catboost: 0.5 }
  member_params:
    lightgbm: { n_estimators: 300, learning_rate: 0.05 }
    catboost: { iterations: 300, learning_rate: 0.05 }

# Layer 5 meta-label TRUST model. Calibration makes P(correct) usable as a sizing
# input; tau gates trades (tuned on cost-adjusted CV); high precision filters
# false positives to protect the cost budget.
meta:
  base: logistic                    # binary base learner
  calibration: isotonic             # isotonic | sigmoid (Platt) | none
  threshold_tau: 0.55               # trade iff P(correct) >= tau
  cv_folds: 5                       # purged CV folds for calibration + OOF

# Layer 6 risk & position sizing.
risk:
  risk_per_trade: 0.005             # 0.5% of equity at risk per trade
  atr_stop_mult: 2.5                # H4 swing stop in [2.0, 3.0] x ATR
  meta_threshold_tau: 0.55          # trade iff P(correct) >= tau (tune on CV)
  kelly_fraction: 0.5               # fractional-Kelly cap on confidence sizing
  max_confidence_mult: 2.0          # hard cap to avoid over-betting miscalibration
  correlation_cap: 0.015            # max aggregate (covariance) risk across legs
  assumed_correlation: 0.6          # EURUSD<->GBPUSD correlation for the cap
  max_drawdown_breaker: 0.10        # circuit breaker: de-risk/halt at 10% DD

# Layer 6b allocation (optional, Roadmap v3) — Dirichlet-policy PPO allocator.
# Only worthwhile once the universe grows beyond two instruments; until then
# the §6 rules above (risk_per_trade/correlation_cap) capture most of the value.
allocation:
  turnover_penalty: 0.001           # lambda1 - cost proxy on Sum|delta weight|
  risk_penalty: 0.5                 # lambda2 - penalty on sqrt(w^T Cov w)
  hidden: 32                        # actor/critic MLP width
  lr: 0.001
  gamma: 0.95
  gae_lambda: 0.90
  clip_eps: 0.2                     # PPO clipped-surrogate epsilon
  entropy_coef: 0.001               # exploration bonus vs. simplex-corner collapse
  value_coef: 0.5
  epochs_per_update: 8
  max_grad_norm: 0.5
  alpha_floor: 0.01                 # keeps Dirichlet concentration away from 0
  seed: 0

# Layer 7 execution guards + order management.
execution:
  max_spread_pips: 2.0
  max_slippage_pips: 1.5
  news_blackout_minutes: 30         # +/- around high-impact releases
  high_impact_events: [NFP, FOMC, ECB, BoE, CPI]
  tp_rr: 1.5                        # take-profit as reward:risk multiple of the stop
  max_retries: 3                    # retries on transient requotes
  magic: 990011                     # idempotent strategy id

# Validation gate (CPCV + walk-forward + never-touched holdout) — the §5 gatekeeper.
validation:
  cpcv_n_groups: 6
  cpcv_n_test_groups: 2
  embargo_pct: 0.01                 # embargo as fraction of sample count
  walk_forward_splits: 5            # sequential forward folds
  walk_forward_mode: anchored       # anchored (expanding) | rolling
  holdout_pct: 0.2                  # final never-touched tail before any capital
  periods_per_year: 1512            # H4 bars/year → Sharpe annualization
  deflated_sharpe_min: 0.95         # P(true SR > 0) after multiple-testing discount
  n_trials: 1                       # # of configurations tried (set honestly!)

# Layer 8 monitoring & lifecycle (Telegram secrets come from .env, not here).
monitoring:
  drawdown_alert: 0.10              # alert when drawdown breaches this
  sharpe_window: 60                # rolling cost-adjusted Sharpe window (trades)
  decay:
    sharpe_window: 60
    min_rolling_sharpe: 0.0        # retrain if rolling Sharpe drops below
    max_calibration_error: 0.10    # retrain if meta-calibration drifts above
