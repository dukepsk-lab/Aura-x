[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aurax"
version = "0.1.0"
description = "Aura-X — ML-driven adaptive trading system (EURUSD/GBPUSD, H4, MT5)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Aura-X" }]

# Core runtime deps that the implemented layers (L0/L1/L4) actually need.
# Heavy / platform-specific deps live in optional-dependencies below so the
# data + feature + labeling stack can be developed and tested on any OS.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
    "structlog>=24.1",
]

[project.optional-dependencies]
# Layer 0 storage / serving
db = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "asyncpg>=0.29",
    "alembic>=1.13",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
]
# Layers 2/3/5 modelling stack
models = [
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "catboost>=1.2",
    "hmmlearn>=0.3",
    "statsmodels>=0.14",
]
# Deep TS ensemble members (Roadmap v2: CNN / PatchTST / SSM). Heavy; opt-in.
deep = [
    "torch>=2.2",
]
# Layer 0 broker connectivity (Windows-only wheel; optional on purpose)
mt5 = [
    "MetaTrader5>=5.0.45",
]
# DB-optional local stores: persist MT5-pulled bars/features/labels as parquet
# so the L1→L4→validation path can run anywhere without TimescaleDB.
files = [
    "pyarrow>=15.0",
]
# Layer 8 monitoring
monitoring = [
    "python-telegram-bot>=21.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "types-PyYAML",
]
# Convenience: everything needed to run the full stack locally.
all = [
    "aurax[db,api,models,monitoring,files,dev]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # line length handled by formatter
    "UP042",  # `str, Enum` mix is intentional (compact, JSON/DB-friendly values)
]

[tool.ruff.lint.per-file-ignores]
# `l` = low is unambiguous in OHLC test fixtures.
"tests/**" = ["E741"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
